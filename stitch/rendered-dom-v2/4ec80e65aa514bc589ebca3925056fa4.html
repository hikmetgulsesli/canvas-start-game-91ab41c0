<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">
  <div data-surface-id="SURF_PLAY_PAGE" class="flex-1 flex flex-col min-h-screen" data-setfarm-element-ref="E000001">
    <!-- Header / Info Bar (Non-actionable) -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur px-8 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded bg-indigo-600 flex items-center justify-center font-bold text-white shadow-md shadow-indigo-500/20">
          C
        </div>
        <span class="font-semibold text-lg tracking-tight text-white">Canvas Game</span>
      </div>

      <div class="flex items-center space-x-8">
        <!-- High Score Status Observable -->
        <div class="flex items-center space-x-2 text-sm">
          <span class="text-slate-400 font-medium">High Score:</span>
          <div role="status" aria-label="High score" class="font-bold text-emerald-400 min-w-[1rem] tracking-wide" data-setfarm-element-ref="E000002"></div>
        </div>

        <!-- Game Status Observable -->
        <div class="flex items-center space-x-2 text-sm">
          <span class="text-slate-400 font-medium">Status:</span>
          <div role="status" aria-label="Game status" class="font-medium text-indigo-400 tracking-wide" data-setfarm-element-ref="E000003">Ready to play</div>
        </div>
      </div>
    </header>

    <!-- Main Game Area -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-8 flex flex-col items-center justify-center">
      <div class="w-full flex flex-col items-center space-y-6">
        <!-- Canvas Container -->
        <div data-surface-id="SURF_GAME_CANVAS" class="w-full aspect-video max-w-4xl bg-slate-900 border border-slate-800 rounded-xl relative overflow-hidden shadow-2xl flex flex-col items-center justify-center" data-setfarm-element-ref="E000004">
          <!-- Decorative Canvas Grid & Visuals -->
          <div class="absolute inset-0 bg-[radial-gradient(#334155_1px,transparent_1px)] [background-size:24px_24px] opacity-40"></div>
          
          <div class="relative z-10 flex flex-col items-center text-center p-6 space-y-4">
            <div class="w-16 h-16 rounded-full bg-slate-800/80 border border-slate-700 flex items-center justify-center text-indigo-400">
              <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
            </div>
            <div class="space-y-1">
              <p class="text-xl font-semibold text-white">Press Start to Begin</p>
              <p class="text-sm text-slate-400 max-w-sm">Launch your session and set a new high score on the arena board.</p>
            </div>
          </div>
        </div>

        <!-- Action Control Panel -->
        <div class="flex items-center justify-center pt-2">
          <button type="button" data-action="ACT_START_GAME" data-control-slot="CSLOT_START_GAME_START_BUTTON" class="px-8 py-3 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold rounded-lg shadow-lg shadow-indigo-600/30 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 focus:ring-offset-slate-950" data-setfarm-element-ref="E000005">Start</button>
        </div>
      </div>
    </main>

    <!-- Footer Chrome (Non-actionable) -->
    <footer class="border-t border-slate-800/80 py-4 px-8 text-center text-xs text-slate-500">
      <span>Canvas Game Workspace © 2025</span>
    </footer>
  </div>


</body></html>
